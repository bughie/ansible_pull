---
all:
  vars:
    ansible_user: linuxadmin
    ansible_ssh_private_key_file: /home/linuxadmin/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3

  children:

    # =========================================================
    # STAGING ENVIRONMENT
    # Network: 10.10.0.0/24
    # =========================================================
    staging:
      vars:
        deployment_environment: staging
        monitoring_enabled: false

      children:

        staging_security_nodes:
          hosts:
            kali-vm.networkbughie.net:
              ansible_host: 10.10.0.6
              ansible_hostname: kali-vm

        staging_webservers:
          hosts:
            web1.networkbughie.net:
              ansible_host: 10.10.0.178
              ansible_hostname: appserver-03
              http_port: 80

            web2:
              ansible_host: 10.10.0.88
              ansible_hostname: proxubun3
              http_port: 8080

            web3.networkbughie.net:
              ansible_host: 10.10.0.202
              ansible_hostname: webapp
              http_port: 80

          vars:
            nginx_worker_processes: 4

        staging_appservers:
          hosts:
            appserver-03:
              ansible_host: 10.10.0.178
              ansible_hostname: docker-srv
              application_port: 8080

        staging_dbservers:
          hosts: {}

        staging_host_servers:
          hosts: {}

    # =========================================================
    # DEVELOPMENT ENVIRONMENT
    # Network: 10.17.17.0/24
    # =========================================================
    development:
      vars:
        deployment_environment: development
        monitoring_enabled: false

      children:

        development_security_nodes:
          hosts: {}

        development_webservers:
          hosts: {}

        development_appservers:
          hosts: {}

        development_dbservers:
          hosts: {}

        development_host_servers:
          hosts: {}

    # =========================================================
    # PRODUCTION ENVIRONMENT
    # Network: 10.100.100.0/24
    # =========================================================
    production:
      vars:
        deployment_environment: production
        monitoring_enabled: true

      children:

        production_security_nodes:
          hosts: {}

        production_webservers:
          hosts: {}

        production_appservers:
          hosts:
            appserver:
              ansible_host: 10.100.100.87
              ansible_hostname: appserver
              application_port: 8080

            appserver-02:
              ansible_host: 10.100.100.223
              ansible_hostname: proxserver1
              application_port: 8080

        production_dbservers:
          hosts:
            db-primary:
              ansible_host: 10.100.100.228
              ansible_hostname: webserver
              mysql_role: primary

            db-replica:
              ansible_host: 10.100.100.94
              ansible_hostname: ubuntu-ser-vm1
              mysql_role: replica

          vars:
            mysql_port: 3306

        production_host_servers:
          hosts:
            ansible-srv:
              ansible_host: 10.100.100.144
              ansible_hostname: ansible-srv

    # =========================================================
    # GLOBAL DUTY GROUPS
    # These groups combine the same duty across all environments.
    # =========================================================

    security_nodes:
      children:
        staging_security_nodes:
        development_security_nodes:
        production_security_nodes:

    webservers:
      children:
        staging_webservers:
        development_webservers:
        production_webservers:

    appservers:
      children:
        staging_appservers:
        development_appservers:
        production_appservers:

    dbservers:
      children:
        staging_dbservers:
        development_dbservers:
        production_dbservers:

    host_servers:
      children:
        staging_host_servers:
        development_host_servers:
        production_host_servers:
