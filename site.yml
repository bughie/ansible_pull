---
- name: Apply Linux baseline
  hosts: all
  become: true

  roles:
  - common
  - security

- name: Configure monitoring baseline
  hosts: all
  become: true

  roles:
    - monitoring

- name: Configure application servers
  hosts: appservers
  become: true

  roles:
    - appserver

- name: Configure web servers
  hosts: webservers
  become: true

  roles:
    - webserver

- name: Configure database servers
  hosts: dbservers
  become: true

  roles:
    - database
