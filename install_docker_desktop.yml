---
- name: Install Docker Desktop for Linux on Ubuntu
  hosts: all
  become: true
  vars:
    docker_desktop_version: "4.33.0"
    docker_desktop_deb_url: "https://desktop.docker.com/linux/main/amd64/docker-desktop-{{ docker_desktop_version }}-amd64.deb"
    target_user: "{{ ansible_user }}"

  tasks:
    - name: Verify KVM support on host
      ansible.builtin.command: kvm-ok
      register: kvm_check
      failed_when: false
      changed_when: false

    - name: Fail if hardware virtualization is disabled
      ansible.builtin.fail:
        msg: "KVM virtualization is not supported or enabled in BIOS on {{ inventory_hostname }}."
      when: kvm_check.rc != 0

    - name: Ensure KVM and virtualization prerequisites are present
      ansible.builtin.apt:
        name:
          - qemu-kvm
          - libvirt-daemon-system
          - cpu-checker
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add user to KVM group for virtualization access
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: kvm
        append: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
        update_cache: true

    - name: Download Docker Desktop DEB package
      ansible.builtin.get_url:
        url: "{{ docker_desktop_deb_url }}"
        dest: "/tmp/docker-desktop.deb"
        mode: '0644'

    - name: Install Docker Desktop package via APT (resolves dependencies)
      ansible.builtin.apt:
        deb: "/tmp/docker-desktop.deb"
        state: present

    - name: Clean up temporary installer
      ansible.builtin.file:
        path: "/tmp/docker-desktop.deb"
        state: absent
