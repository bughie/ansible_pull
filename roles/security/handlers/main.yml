---
- name: Restart SSH
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart Fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart Fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: reload ufw
  community.general.ufw:
    state: reloaded

- name: restart auditd
  ansible.builtin.command:
    cmd: service auditd restart

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
