---
- name: Install libpam-pwquality
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Enforce password complexity rules
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^#?minlen =', line: 'minlen = 14' }
    - { regexp: '^#?dcredit =', line: 'dcredit = -1' }
    - { regexp: '^#?ucredit =', line: 'ucredit = -1' }
    - { regexp: '^#?lcredit =', line: 'lcredit = -1' }
    - { regexp: '^#?ocredit =', line: 'ocredit = -1' }

- name: Set shadow password aging limits
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^PASS_MAX_DAYS', line: 'PASS_MAX_DAYS   90' }
    - { regexp: '^PASS_MIN_DAYS', line: 'PASS_MIN_DAYS   7' }
    - { regexp: '^PASS_WARN_AGE', line: 'PASS_WARN_AGE   14' }

- name: Ensure PAM password quality library is installed
  ansible.builtin.apt:
    name:
      - libpam-pwquality
      - libpam-runtime
    state: present
    update_cache: true

- name: Configure PAM pwquality settings (complexity, length, history)
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^#?\\s*{{ item.key }}"
    line: "{{ item.key }} = {{ item.value }}"
    state: present
    create: true
    owner: root
    group: root
    mode: '0644'
  loop:
    - { key: 'minlen', value: '14' }
    - { key: 'dcredit', value: '-1' }
    - { key: 'ucredit', value: '-1' }
    - { key: 'lcredit', value: '-1' }
    - { key: 'ocredit', value: '-1' }
    - { key: 'minclass', value: '4' }
    - { key: 'maxrepeat', value: '3' }
    - { key: 'gecoscheck', value: '1' }
    - { key: 'dictcheck', value: '1' }

- name: Configure shadow password aging defaults in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*{{ item.key }}"
    line: "{{ item.key }}\t{{ item.value }}"
    state: present
  loop:
    - { key: 'PASS_MAX_DAYS', value: '90' }
    - { key: 'PASS_MIN_DAYS', value: '7' }
    - { key: 'PASS_WARN_AGE', value: '14' }
    - { key: 'UMASK', value: '027' }

- name: Enforce login failure lockout in PAM common-auth
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    insertbefore: "^auth\\s+primary\\s+required"
    line: "auth required pam_faillock.so preauth silent audit deny=5 unlock_time=900"
    state: present
