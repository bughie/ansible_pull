---
# ============================================================
# SECURITY BASELINE
# ============================================================

- name: Install security packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - auditd
      - audispd-plugins
      - unattended-upgrades
    state: present
    update_cache: true

# ============================================================
# SSH HARDENING
# ============================================================

- name: Create SSH hardening configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-ansible-ssh-hardening.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible
      # DO NOT EDIT MANUALLY

      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      UsePAM yes
  notify: Restart SSH

- name: Validate SSH configuration
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: false

# ============================================================
# FAIL2BAN
# ============================================================
#
#- name: Enable and start fail2ban
#  ansible.builtin.systemd:
#    name: fail2ban
#    enabled: true
#    state: started
#
# ============================================================
# AUDITD
# ============================================================

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# ============================================================
# UNATTENDED SECURITY UPDATES
# ============================================================

- name: Enable unattended security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# ============================================================
# FILESYSTEM PERMISSIONS
# ============================================================

- name: Secure SSH directory
  ansible.builtin.file:
    path: /etc/ssh
    owner: root
    group: root
    mode: '0755'

- name: Secure SSH configuration
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'

# ============================================================
# UFW FIREWALL BASELINE
# ============================================================

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow application port
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "on"

- name: Display UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Show UFW status
  ansible.builtin.debug:
    var: ufw_status.stdout_lines

# ============================================================
# UFW FIREWALL
# ============================================================

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable UFW logging
  community.general.ufw:
    logging: "low"

# ============================================================
# FAIL2BAN
# ============================================================

- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Ensure Fail2ban configuration directory exists
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Fail2ban SSH protection
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = ssh
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart Fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: SSH Hardening
  ansible.builtin.include_tasks: ssh.yml

- name: UFW Firewall
  ansible.builtin.include_tasks: ufw.yml

- name: Fail2ban Configuration
  ansible.builtin.include_tasks: fail2ban.yml

- name: Auditd Monitoring
  ansible.builtin.include_tasks: auditd.yml

- name: Automatic Security Updates
  ansible.builtin.include_tasks: security_updates.yml

- name: Password Policy
  ansible.builtin.include_tasks: password_policy.yml

- name: Sysctl Hardening
  ansible.builtin.include_tasks: sysctl.yml

- name: Filesystem Permissions
  ansible.builtin.include_tasks: filesystem.yml

- name: Security Baseline Validation
  ansible.builtin.include_tasks: validation.yml

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks: ssh.yml

