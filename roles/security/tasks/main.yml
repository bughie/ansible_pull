  ansible.builtin.include_tasks: fail2ban.yml

- name: Include Auditd tasks
  ansible.builtin.include_tasks: auditd.yml

- name: Include Unattended Security Updates tasks
  ansible.builtin.include_tasks: unattended_upgrades.yml

- name: Include Password Policy tasks
  ansible.builtin.include_tasks: password_policy.yml

- name: Include Filesystem Permissions tasks
  ansible.builtin.include_tasks: filesystem_permissions.yml

