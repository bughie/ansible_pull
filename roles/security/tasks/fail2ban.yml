---
- name: Ensure Fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure Fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify: Restart Fail2ban

- name: Ensure Fail2ban is enabled
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
