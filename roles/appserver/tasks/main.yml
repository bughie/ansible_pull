---
- name: Install application server tools
  ansible.builtin.apt:
    name: "{{ appserver_packages }}"
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create application logs directory
  ansible.builtin.file:
    path: /var/log/app
    state: directory
    owner: root
    group: root
    mode: '0755'
