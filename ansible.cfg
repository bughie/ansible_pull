[defaults]
inventory = inventories/hosts.yml
remote_user = linuxadmin
private_key_file = /home/linuxadmin/.ssh/id_ed25519
host_key_checking = False
forks = 5

[ssh_connection]
# Pass keep-alive arguments directly to OpenSSH
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes
# Re-use control paths cleanly
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/ansible-ssh-%%h-%%p-%%r
pipelining = True
